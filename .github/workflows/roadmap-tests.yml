name: Roadmap smoke tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v0.7 status migration
        run: node scripts/update-v07.js
      - name: Apply v0.8 Media Guide migration
        run: node scripts/update-v08.js
      - name: Run roadmap tests
        run: node tests/roadmap.test.js
      - name: Commit roadmap migrations when needed
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update roadmap to v0.8"
          git push
